<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Marca Trimly: T estilizada; la banda verde corta el tallo en dos piezas separadas -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>

  <!-- Barra superior con muesca en V al centro -->
  <path
    fill="#0A0A0B"
    fill-rule="evenodd"
    stroke="#ffffff"
    stroke-opacity="0.85"
    stroke-width="10"
    stroke-linejoin="round"
    d="M74 40h364c21 0 38 17 38 38v34c0 21-17 38-38 38H74c-21 0-38-17-38-38V78c0-21 17-38 38-38Z
       M256 142l-44-102h88Z"
  />

  <!-- Tallo: pieza superior (cortada en diagonal, sin tocar la banda) -->
  <path
    fill="#0A0A0B"
    stroke="#ffffff"
    stroke-opacity="0.85"
    stroke-width="10"
    stroke-linejoin="round"
    d="M206 218c0-18 14-32 32-32h36c18 0 32 14 32 32v36l-100 50v-86Z"
  />

  <!-- Tallo: pieza inferior -->
  <path
    fill="#0A0A0B"
    stroke="#ffffff"
    stroke-opacity="0.85"
    stroke-width="10"
    stroke-linejoin="round"
    d="M206 406l100-50v82c0 18-14 32-32 32h-36c-18 0-32-14-32-32v-32Z"
  />

  <!-- Banda verde con brillo, en el hueco del corte -->
  <g>
    <path d="M180 335 L332 259 L332 325 L180 401 Z" fill="#2FE3A5" opacity="0.5" filter="url(#glow)" />
    <path d="M180 335 L332 259 L332 325 L180 401 Z" fill="#2FE3A5" />
  </g>
</svg>
